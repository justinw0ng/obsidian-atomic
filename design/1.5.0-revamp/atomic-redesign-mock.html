<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Tracker — redesign mock</title>
<style id="css-chrome">
/*
  Mock-only: fake Obsidian theme variables, window/phone chrome, and the
  review-board frame. Nothing here ships; atomic.css is the proposal.
*/

.theme-light {
  --background-primary: #ffffff;
  --background-primary-alt: #fafafa;
  --background-secondary: #f6f6f6;
  --background-secondary-alt: #ededed;
  --background-modifier-border: #e0e0e0;
  --background-modifier-hover: rgba(0, 0, 0, 0.05);
  --text-normal: #222222;
  --text-muted: #5c5c5c;
  --text-faint: #ababab;
  --text-accent: #6c4ee3;
  --text-error: #e03140;
  --interactive-accent: #7c5cf0;
  --icon-color: #6b6b6b;
  --font-interface: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-text: var(--font-interface);
  --font-monospace: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}

.theme-dark {
  --background-primary: #1e1e1e;
  --background-primary-alt: #242424;
  --background-secondary: #262626;
  --background-secondary-alt: #2e2e2e;
  --background-modifier-border: #363636;
  --background-modifier-hover: rgba(255, 255, 255, 0.06);
  --text-normal: #dadada;
  --text-muted: #a3a3a3;
  --text-faint: #666666;
  --text-accent: #a68af9;
  --text-error: #fb5560;
  --interactive-accent: #8b6cf5;
  --icon-color: #9a9a9a;
  --font-interface: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-text: var(--font-interface);
  --font-monospace: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, monospace;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11" 1, "ss01" 0;
}

button {
  font: inherit;
}

/* ------------------------------------------------------------ desktop */

.ob-window {
  --ob-w: 1280px;
  position: relative;
  width: var(--ob-w);
  border-radius: 10px;
  overflow: hidden;
  background: var(--background-primary);
  color: var(--text-normal);
  font-family: var(--font-interface);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.14),
    0 2px 4px rgba(0, 0, 0, 0.04),
    0 40px 80px -30px rgba(0, 0, 0, 0.35);
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  grid-template-rows: 38px auto;
  transform: translateZ(0);
}

.theme-dark.ob-window {
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08),
    0 40px 80px -30px rgba(0, 0, 0, 0.8);
}

.ob-window.is-flat {
  border-radius: 0;
  box-shadow: none;
}

.ob-titlebar {
  grid-column: 1 / -1;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 0 10px 0 14px;
  background: var(--background-secondary);
  border-bottom: 1px solid var(--background-modifier-border);
}

.ob-lights {
  display: flex;
  gap: 8px;
  align-self: center;
  margin-right: 14px;
}

.ob-lights > span {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff5f57;
  box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
}

.ob-lights > span:nth-child(2) {
  background: #febc2e;
}

.ob-lights > span:nth-child(3) {
  background: #28c840;
}

.ob-tab {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 30px;
  min-width: 180px;
  padding: 0 10px 0 12px;
  margin-bottom: -1px;
  border-radius: 8px 8px 0 0;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-bottom-color: var(--background-primary);
  font-size: 12.5px;
  color: var(--text-normal);
}

.ob-tab .ob-x {
  margin-left: auto;
  color: var(--text-muted);
  font-size: 13px;
}

.ob-plus {
  align-self: center;
  color: var(--icon-color);
  font-size: 16px;
  padding: 0 6px;
}

.ob-title-actions {
  margin-left: auto;
  align-self: center;
  display: flex;
  gap: 14px;
  color: var(--icon-color);
}

.ob-ribbon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding-top: 14px;
  background: var(--background-secondary);
  border-right: 1px solid var(--background-modifier-border);
  color: var(--icon-color);
}

.ob-icon {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 1.6;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}

.ob-main {
  position: relative;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.ob-viewhead {
  display: flex;
  align-items: center;
  height: 40px;
  padding: 0 14px;
  color: var(--icon-color);
  gap: 14px;
}

.ob-crumbs {
  flex: 1;
  text-align: center;
  font-size: 12.5px;
  color: var(--text-muted);
}

.ob-crumbs b {
  font-weight: 500;
  color: var(--text-normal);
}

.ob-content {
  position: relative;
  padding: 26px 56px 64px;
}

.ob-content.is-readable {
  padding-left: max(56px, calc((100% - 760px) / 2));
  padding-right: max(56px, calc((100% - 760px) / 2));
}

.ob-inline-title {
  margin: 0 0 22px;
  font-size: 30px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-normal);
}

.ob-h1 {
  margin: 0 0 18px;
  font-size: 26px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-normal);
}

.ob-h2 {
  margin: 34px 0 10px;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.ob-h3 {
  margin: 26px 0 8px;
  font-size: 18px;
  font-weight: 650;
}

.ob-p {
  margin: 0 0 12px;
  font-size: 16px;
  line-height: 1.6;
  color: var(--text-normal);
}

.ob-p.is-muted {
  color: var(--text-muted);
}

.ob-ul {
  margin: 0 0 12px;
  padding-left: 22px;
  font-size: 16px;
  line-height: 1.6;
}

.ob-ul li::marker {
  color: var(--text-faint);
}

.ob-code {
  font-family: var(--font-monospace);
  font-size: 0.88em;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--background-secondary);
}

/* Obsidian-rendered markdown table (not Atomic DOM). */
.ob-table {
  border-collapse: collapse;
  font-size: 15px;
  margin: 20px 0 16px;
}

.ob-table th,
.ob-table td {
  border: 1px solid var(--background-modifier-border);
  padding: 4px 12px;
  text-align: left;
}

.ob-table th {
  font-weight: 650;
}

.ob-props {
  margin: 0 0 20px;
  font-size: 13.5px;
}

.ob-props-title {
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 6px;
}

.ob-prop {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 8px;
  padding: 3px 0;
}

.ob-prop span:first-child {
  color: var(--text-muted);
}

.ob-status {
  position: absolute;
  right: 0;
  bottom: 0;
  padding: 3px 12px;
  border-top-left-radius: 8px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  border-right: 0;
  border-bottom: 0;
  font-size: 12px;
  color: var(--text-muted);
}

/* -------------------------------------------------------------- phone */

.ob-phone {
  position: relative;
  width: 412px;
  height: 866px;
  padding: 11px;
  border-radius: 64px;
  background: #0d0d0e;
  box-shadow:
    inset 0 0 0 1.5px #3a3a3c,
    0 0 0 1px rgba(0, 0, 0, 0.25),
    0 50px 90px -40px rgba(0, 0, 0, 0.55);
  flex: none;
}

.ob-phone-screen {
  position: relative;
  width: 390px;
  height: 844px;
  border-radius: 53px;
  overflow: hidden;
  background: var(--background-primary);
  color: var(--text-normal);
  font-family: var(--font-interface);
  display: flex;
  flex-direction: column;
  transform: translateZ(0);
}

.ob-island {
  position: absolute;
  top: 11px;
  left: 50%;
  width: 124px;
  height: 36px;
  margin-left: -62px;
  border-radius: 20px;
  background: #000;
  z-index: 100;
}

.ob-statusbar {
  flex: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 54px;
  padding: 6px 34px 0 46px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  background: var(--background-primary);
}

.ob-statusbar-icons {
  display: flex;
  gap: 6px;
  align-items: center;
}

.ob-mhead {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 44px;
  padding: 0 16px;
  color: var(--icon-color);
  border-bottom: 1px solid var(--background-modifier-border);
}

.ob-mhead-title {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-normal);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ob-mcontent {
  position: relative;
  flex: 1;
  overflow: hidden;
  padding: 18px 16px 24px;
}

.ob-mcontent-inner {
  position: relative;
}

.ob-mcontent .ob-inline-title {
  font-size: 26px;
  margin-bottom: 16px;
}

.ob-mnav {
  flex: none;
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 50px;
  padding: 0 12px;
  border-top: 1px solid var(--background-modifier-border);
  background: var(--background-secondary);
  color: var(--icon-color);
}

.ob-home {
  flex: none;
  height: 30px;
  background: var(--background-secondary);
  position: relative;
}

.ob-home::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 9px;
  width: 136px;
  height: 5px;
  margin-left: -68px;
  border-radius: 3px;
  background: var(--text-normal);
}

/* -------------------------------------------------------------- board */

.board {
  --board-bg: #ebeae6;
  --board-ink: #1d1d1b;
  --board-muted: #6b6a66;
  --board-rule: rgba(0, 0, 0, 0.1);
  --redline: #f0532a;
  position: relative;
  display: inline-block;
  min-width: 100%;
  padding: 60px 72px 72px;
  background: var(--board-bg);
  color: var(--board-ink);
  font-family: "Inter", -apple-system, sans-serif;
}

.board.is-dark {
  --board-bg: #111111;
  --board-ink: #ededed;
  --board-muted: #8f8f8f;
  --board-rule: rgba(255, 255, 255, 0.1);
}

.board-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 40px;
  align-items: end;
  margin-bottom: 44px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--board-rule);
}

.board-kicker {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--board-muted);
  margin-bottom: 10px;
}

.board-title {
  margin: 0;
  font-size: 34px;
  line-height: 1.15;
  font-weight: 650;
  letter-spacing: -0.025em;
}

.board-sub {
  margin: 10px 0 0;
  max-width: 820px;
  font-size: 16px;
  line-height: 1.5;
  color: var(--board-muted);
}

.board-meta {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--board-muted);
  text-align: right;
  white-space: nowrap;
}

.board-body {
  display: grid;
  grid-template-columns: max-content 340px;
  gap: 56px;
  align-items: start;
}

.board-body.is-solo {
  grid-template-columns: max-content;
}

.board-stage {
  position: relative;
}

.board-row {
  display: flex;
  gap: 48px;
  align-items: flex-start;
}

.board-col {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.board-cap {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--board-muted);
  margin: 0 0 14px;
}

.board-cap b {
  color: var(--board-ink);
  font-weight: 600;
}

.notes {
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.notes-title {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--board-muted);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--board-rule);
}

.note {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 12px;
  font-size: 14.5px;
  line-height: 1.5;
}

.note b {
  font-weight: 600;
}

.note p {
  margin: 0;
  color: var(--board-muted);
}

.note p b {
  color: var(--board-ink);
}

.note-num,
.marker {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--redline);
  color: #fff;
  font: 600 11.5px/1 "JetBrains Mono", ui-monospace, monospace;
}

.marker {
  position: absolute;
  z-index: 200;
  box-shadow:
    0 0 0 3px rgba(240, 83, 42, 0.22),
    0 2px 6px rgba(0, 0, 0, 0.2);
  pointer-events: none;
}

.redline-box {
  position: absolute;
  z-index: 150;
  border: 1.5px dashed var(--redline);
  border-radius: 6px;
  pointer-events: none;
}

.tag-rec {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--board-ink);
  color: var(--board-bg);
  font: 600 11px/1 "JetBrains Mono", ui-monospace, monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.tag-plain {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--board-rule);
  color: var(--board-muted);
  font: 500 11px/1 "JetBrains Mono", ui-monospace, monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.mock-toast {
  position: absolute;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--background-secondary);
  color: var(--text-normal);
  box-shadow: 0 0 0 1px var(--background-modifier-border), 0 8px 24px -8px rgba(0, 0, 0, 0.3);
  font: 13px/1.4 var(--font-interface);
  z-index: 300;
}

</style>

/* ------------------------------------------------------------------ tokens */

.fitness-plugin {
  --atomic-font: var(--font-interface);
  --atomic-mono: var(--font-monospace);

  --atomic-ink: var(--text-normal);
  --atomic-ink-2: var(--text-muted);
  --atomic-paper: var(--background-primary);
  --atomic-rule: color-mix(in srgb, var(--text-normal) 11%, transparent);
  --atomic-rule-strong: color-mix(in srgb, var(--text-normal) 22%, transparent);
  --atomic-fill-1: color-mix(in srgb, var(--text-normal) 4.5%, transparent);
  --atomic-fill-2: color-mix(in srgb, var(--text-normal) 8%, transparent);
  --atomic-fill-3: color-mix(in srgb, var(--text-normal) 13%, transparent);
  --atomic-empty: color-mix(in srgb, var(--text-normal) 7%, transparent);
  --atomic-future: color-mix(in srgb, var(--text-normal) 3.5%, transparent);
  --atomic-focus: var(--interactive-accent);
  --atomic-link-hover: var(--text-accent);

  --atomic-r-object: 3px;
  --atomic-r-control: 9px;
  --atomic-r-well: 14px;

  --atomic-ease: cubic-bezier(0.32, 0.72, 0, 1);
  --atomic-t-press: 120ms;
  --atomic-t-hover: 240ms;
  --atomic-t-move: 560ms;
  --atomic-stagger: 30ms;

  --atomic-c: var(--text-muted);

  font-family: var(--atomic-font);
  font-size: 13px;
  line-height: 1.45;
  color: var(--atomic-ink);
  -webkit-font-smoothing: antialiased;
}

/* ------------------------------------------------------------- type roles */

.fitness-plugin .atomic-caption {
  font-size: 12px;
  line-height: 16px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-readout {
  font-family: var(--atomic-mono);
  font-size: 11px;
  line-height: 16px;
  color: var(--atomic-ink-2);
  font-variant-numeric: lining-nums tabular-nums;
  white-space: nowrap;
  transition: color var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-readout.is-live {
  color: var(--atomic-ink);
}

.fitness-plugin .atomic-hint {
  font-size: 12px;
  line-height: 16px;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-num {
  font-variant-numeric: lining-nums tabular-nums;
}

.fitness-plugin .atomic-unit {
  font-weight: 500;
  color: var(--atomic-ink-2);
  letter-spacing: 0;
}

/*
  Bilingual labels (zh-Hant-en): English line, then the Chinese line,
  muted. Units and inline phrases join with a space, never a slash.
*/
.fitness-plugin .atomic-label {
  display: inline-flex;
  flex-direction: column;
  gap: 1px;
}

.fitness-plugin .atomic-label-zh {
  font-family: var(--atomic-font);
  font-size: max(12px, 1em);
  letter-spacing: 0.02em;
  font-weight: 400;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-caption .atomic-label-zh,
.fitness-plugin .atomic-readout .atomic-label-zh,
.fitness-plugin .atomic-hint .atomic-label-zh {
  font-size: 12px;
  line-height: 15px;
}

.fitness-plugin .atomic-inline-zh {
  margin-left: 0.3em;
  color: var(--atomic-ink-2);
  font-weight: 400;
  letter-spacing: 0.02em;
  font-family: var(--atomic-font);
}

/* ------------------------------------------------------------- data marks */

.fitness-plugin .atomic-dot {
  display: inline-block;
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--atomic-c);
}

.fitness-plugin .atomic-name {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  color: var(--atomic-ink);
}

/* ------------------------------------------------------------------ links */

.fitness-plugin .atomic-link {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  color: var(--atomic-ink-2);
  text-decoration: none;
  white-space: nowrap;
  border-radius: 4px;
  transition: color var(--atomic-t-hover) var(--atomic-ease);
  cursor: pointer;
}

.fitness-plugin .atomic-link-arrow {
  font-size: 11px;
  transition: transform var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-link:hover,
.fitness-plugin .atomic-link.is-preview {
  color: var(--atomic-link-hover);
}

.fitness-plugin .atomic-link:hover .atomic-link-arrow,
.fitness-plugin .atomic-link.is-preview .atomic-link-arrow {
  transform: translate(2px, -1px);
}

.fitness-plugin .atomic-link:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--atomic-focus);
}

/* --------------------------------------------------------------- controls */

.fitness-plugin .atomic-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 14px;
  margin: 0;
  border: 0;
  border-radius: var(--atomic-r-control);
  background: var(--atomic-fill-2);
  box-shadow: none;
  color: var(--atomic-ink);
  font-family: var(--atomic-font);
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition:
    transform var(--atomic-t-press) var(--atomic-ease),
    background-color var(--atomic-t-hover) var(--atomic-ease),
    color var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-btn:hover {
  background: var(--atomic-fill-3);
}

.fitness-plugin .atomic-btn:active {
  transform: scale(0.97);
}

.fitness-plugin .atomic-btn:focus-visible,
.fitness-plugin .atomic-field:focus-within,
.fitness-plugin .atomic-seg-option:focus-visible {
  outline: none;
  box-shadow:
    0 0 0 2px var(--atomic-paper),
    0 0 0 4px var(--atomic-focus);
}

.fitness-plugin .atomic-btn.is-primary {
  background: var(--atomic-ink);
  color: var(--atomic-paper);
}

.fitness-plugin .atomic-btn.is-primary:hover {
  background: color-mix(in srgb, var(--atomic-ink) 86%, var(--atomic-paper));
}

.fitness-plugin .atomic-btn.is-quiet {
  background: transparent;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-btn.is-quiet:hover {
  background: var(--atomic-fill-1);
  color: var(--atomic-ink);
}

.fitness-plugin .atomic-btn.is-danger {
  background: transparent;
  color: var(--text-error);
}

.fitness-plugin .atomic-btn.is-danger:hover {
  background: color-mix(in srgb, var(--text-error) 9%, transparent);
}

/* Destructive actions confirm in place; the second press commits. */
.fitness-plugin .atomic-btn.is-danger.is-armed {
  background: var(--text-error);
  color: var(--atomic-paper);
}

.fitness-plugin .atomic-btn.is-icon {
  width: 32px;
  padding: 0;
}

.fitness-plugin .atomic-btn.is-small {
  height: 28px;
  padding: 0 10px;
}

.fitness-plugin .atomic-btn .atomic-inline-zh {
  color: inherit;
  opacity: 0.68;
  margin-left: 0;
}

.fitness-plugin .atomic-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 1.6;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* A control is one step off its surface: fill on paper, paper in a well. */
.fitness-plugin.atomic-well,
.fitness-plugin .atomic-well {
  background: var(--atomic-fill-1);
  border-radius: var(--atomic-r-well);
}

.fitness-plugin .atomic-field {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  min-width: 0;
  padding: 0 12px;
  border-radius: var(--atomic-r-control);
  background: var(--atomic-fill-1);
  color: var(--atomic-ink);
  transition: background-color var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin.atomic-well :is(.atomic-field, .atomic-stepper, .atomic-seg),
.fitness-plugin .atomic-well :is(.atomic-field, .atomic-stepper, .atomic-seg) {
  background: var(--atomic-paper);
}

.fitness-plugin .atomic-field-label {
  flex: none;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-field-value {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.fitness-plugin .atomic-field-value.is-placeholder {
  font-weight: 400;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-field-suffix {
  flex: none;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-field-chevron {
  flex: none;
  width: 14px;
  height: 14px;
  stroke: var(--atomic-ink-2);
  stroke-width: 1.6;
  fill: none;
}

.fitness-plugin .atomic-stepper {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 2px;
  box-sizing: border-box;
  border-radius: var(--atomic-r-control);
  background: var(--atomic-fill-1);
}

.fitness-plugin .atomic-stepper.is-tall {
  height: 36px;
}

.fitness-plugin .atomic-stepper .atomic-btn {
  width: 28px;
  height: 100%;
  padding: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-stepper .atomic-btn:hover {
  background: var(--atomic-fill-2);
  color: var(--atomic-ink);
}

.fitness-plugin .atomic-stepper-value {
  min-width: 40px;
  padding: 0 4px;
  text-align: center;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.fitness-plugin .atomic-stepper-label {
  padding: 0 4px 0 10px;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-seg {
  display: inline-flex;
  padding: 2px;
  border-radius: var(--atomic-r-control);
  background: var(--atomic-fill-1);
}

.fitness-plugin .atomic-seg-option {
  appearance: none;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  box-shadow: none;
  color: var(--atomic-ink-2);
  font: 500 13px/1 var(--atomic-font);
  cursor: pointer;
  transition:
    background-color var(--atomic-t-hover) var(--atomic-ease),
    color var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-seg-option.is-on {
  background: var(--atomic-fill-3);
  color: var(--atomic-ink);
}

/* Value row: label left, value right, value drawn as fill. */
.fitness-plugin .atomic-fill-row {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--atomic-r-control);
  background: var(--atomic-fill-1);
  overflow: hidden;
}

.fitness-plugin .atomic-fill-row::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: calc(var(--v, 0) * 100%);
  background: color-mix(in srgb, var(--atomic-c) 22%, transparent);
  transition: width var(--atomic-t-move) var(--atomic-ease);
}

.fitness-plugin .atomic-fill-row > * {
  position: relative;
}

.fitness-plugin .atomic-fill-row-value {
  font-size: 12px;
  color: var(--atomic-ink-2);
  font-variant-numeric: lining-nums tabular-nums;
  white-space: nowrap;
}

/* ------------------------------------------------------- rolling numbers */

/*
  Each digit is a clipped reel. A hidden ghost digit keeps width and
  baseline; the reel slides on value change (rightmost first). Nothing
  fades at the edges: masks are banned, overflow does the clipping.
*/
.fitness-plugin .atomic-roll {
  display: inline-block;
  white-space: nowrap;
  font-variant-numeric: lining-nums tabular-nums;
}

.fitness-plugin .atomic-digit {
  position: relative;
  display: inline-block;
  line-height: 1.15;
}

.fitness-plugin .atomic-digit-ghost {
  visibility: hidden;
}

.fitness-plugin .atomic-digit-clip {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.fitness-plugin .atomic-reel {
  display: block;
  transform: translateY(calc(var(--d, 0) * -1.15em));
  transition: transform var(--atomic-t-move) var(--atomic-ease);
  transition-delay: calc(var(--i, 0) * var(--atomic-stagger));
}

.fitness-plugin .atomic-reel > span {
  display: block;
  height: 1.15em;
  line-height: 1.15;
  text-align: center;
}

.fitness-plugin .atomic-digit.is-entering {
  animation: atomic-digit-in var(--atomic-t-move) var(--atomic-ease) both;
}

@keyframes atomic-digit-in {
  from {
    opacity: 0;
  }
}

/* ------------------------------------------------------------- dashboard */

.fitness-plugin.atomic-dashboard {
  container-type: inline-size;
  container-name: atomic-dash;
  margin: 4px 0 32px;
}

.fitness-plugin .atomic-dash-top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 16px;
  margin-bottom: 24px;
}

.fitness-plugin .atomic-dash-range {
  flex: 1 1 auto;
}

.fitness-plugin .atomic-jumps {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 20px;
}

.fitness-plugin .atomic-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--atomic-rule-strong);
  border-bottom: 1px solid var(--atomic-rule);
}

.fitness-plugin .atomic-kpi {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  padding: 14px 20px 18px;
}

.fitness-plugin .atomic-kpi:first-child {
  padding-left: 0;
}

.fitness-plugin .atomic-kpi + .atomic-kpi {
  border-left: 1px solid var(--atomic-rule);
}

.fitness-plugin .atomic-kpi-value {
  margin-top: 2px;
  font-size: 34px;
  line-height: 1.15;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--atomic-ink);
  white-space: nowrap;
}

.fitness-plugin .atomic-kpi-value .atomic-unit {
  margin: 0 0.18em 0 0.06em;
  font-size: 15px;
}

.fitness-plugin .atomic-section {
  margin-top: 48px;
}

.fitness-plugin .atomic-section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--atomic-rule-strong);
}

.fitness-plugin .atomic-section-head > :first-child {
  display: flex;
  align-items: baseline;
  gap: 20px;
}

.fitness-plugin .atomic-section-head .atomic-caption {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--atomic-ink);
}

.fitness-plugin .atomic-legend {
  display: inline-flex;
  gap: 14px;
  font-size: 12px;
  line-height: 16px;
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-legend > span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Activities: a ledger, one row per activity. */
.fitness-plugin .atomic-ledger {
  --atomic-ledger-cols: minmax(150px, 1.25fr) minmax(104px, 0.8fr) minmax(112px, 0.85fr) minmax(128px, 1fr) minmax(220px, 2.1fr) 92px;
}

.fitness-plugin .atomic-ledger-head,
.fitness-plugin .atomic-ledger-row {
  display: grid;
  grid-template-columns: var(--atomic-ledger-cols);
  column-gap: 20px;
  align-items: center;
}

.fitness-plugin .atomic-ledger-head {
  padding: 10px 0 8px;
  border-bottom: 1px solid var(--atomic-rule);
}

.fitness-plugin .atomic-ledger-row {
  padding: 14px 0;
  border-bottom: 1px solid var(--atomic-rule);
}

.fitness-plugin .atomic-ledger-name {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.fitness-plugin .atomic-ledger-name .atomic-name {
  font-size: 15px;
}

.fitness-plugin .atomic-ledger-name .atomic-caption {
  padding-left: 16px;
}

.fitness-plugin .atomic-stat {
  font-size: 20px;
  line-height: 1.15;
  font-weight: 500;
  letter-spacing: -0.01em;
  font-variant-numeric: lining-nums tabular-nums;
  white-space: nowrap;
}

.fitness-plugin .atomic-stat .atomic-unit {
  margin-left: 0.25em;
  font-size: 13px;
  letter-spacing: 0;
}

.fitness-plugin .atomic-stat .atomic-unit.is-tight {
  margin: 0 0.2em 0 0.04em;
}

.fitness-plugin .atomic-ledger-detail {
  color: var(--atomic-ink-2);
  font-variant-numeric: tabular-nums;
}

.fitness-plugin .atomic-ledger-detail strong {
  color: var(--atomic-ink);
  font-weight: 600;
}

.fitness-plugin .atomic-ledger-end {
  justify-self: end;
}

.fitness-plugin .atomic-months,
.fitness-plugin .atomic-month-initials {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: 5px;
}

.fitness-plugin .atomic-months {
  align-items: end;
  height: 30px;
}

.fitness-plugin .atomic-month-initials > span {
  text-align: center;
}

.fitness-plugin .atomic-ledger-bars .atomic-month-initials {
  display: none;
}

.fitness-plugin .atomic-month-initials > span.is-now {
  color: var(--atomic-ink);
}

.fitness-plugin .atomic-bar {
  justify-self: center;
  width: min(9px, 100%);
  height: calc(var(--v, 0) * 100%);
  min-height: 3px;
  border-radius: 1.5px 1.5px 0 0;
  background: var(--atomic-c);
}

.fitness-plugin .atomic-bar.is-zero {
  height: 2px;
  min-height: 0;
  background: var(--atomic-fill-3);
}

.fitness-plugin .atomic-bar.is-future {
  height: 1px;
  min-height: 0;
  background: var(--atomic-rule);
}

/* Monthly: stacked columns on thin gridlines. */
.fitness-plugin .atomic-chart {
  position: relative;
  display: grid;
  grid-template-columns: 28px 1fr;
  margin-top: 16px;
}

.fitness-plugin .atomic-chart-y {
  position: relative;
  height: 168px;
}

.fitness-plugin .atomic-chart-y > span {
  position: absolute;
  left: 0;
  transform: translateY(50%);
  bottom: calc(var(--y) * 100%);
}

.fitness-plugin .atomic-chart-plot {
  position: relative;
  height: 168px;
}

.fitness-plugin .atomic-chart-grid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(var(--y) * 100%);
  height: 1px;
  background: var(--atomic-rule);
}

.fitness-plugin .atomic-chart-grid.is-base {
  background: var(--atomic-rule-strong);
}

.fitness-plugin .atomic-chart-cols {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
}

.fitness-plugin .atomic-chart-col {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: 2px;
  cursor: default;
  transition: opacity var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-chart-seg {
  width: min(28px, 46%);
  height: calc(var(--v) * 100%);
  background: var(--atomic-c);
}

.fitness-plugin .atomic-chart-seg:last-child {
  border-radius: 2px 2px 0 0;
}

.fitness-plugin .atomic-chart-col.is-future::after {
  content: "";
  width: min(28px, 46%);
  height: 0;
  border-top: 1px dashed var(--atomic-rule-strong);
}

.fitness-plugin .atomic-chart-x {
  grid-column: 2;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  padding-top: 8px;
}

.fitness-plugin .atomic-chart-x > span {
  text-align: center;
  transition: color var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-chart.is-reading .atomic-chart-col {
  opacity: 0.28;
}

.fitness-plugin .atomic-chart.is-reading .atomic-chart-col.is-hot {
  opacity: 1;
}

.fitness-plugin .atomic-chart-x > span.is-hot {
  color: var(--atomic-ink);
}

.fitness-plugin .atomic-chart-x .is-short {
  display: none;
}

.fitness-plugin .atomic-quiet-toggle {
  margin-top: 14px;
  font-size: 13px;
}

/* Muscles / Golf focus / Recent share one grid that widens with the pane. */
.fitness-plugin .atomic-split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 48px;
}

.fitness-plugin .atomic-split > .atomic-section.is-wide {
  grid-column: 1 / -1;
}

.fitness-plugin .atomic-stack {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 12px;
}

.fitness-plugin .atomic-leader-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 0;
}

.fitness-plugin .atomic-leader {
  flex: 1 1 auto;
  height: 1px;
  align-self: center;
  margin-top: 4px;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--text-normal) 34%, transparent) 0.9px, transparent 1.1px);
  background-size: 6px 2px;
  background-repeat: repeat-x;
}

.fitness-plugin .atomic-leader-value {
  font-size: 12px;
  color: var(--atomic-ink-2);
  font-variant-numeric: lining-nums tabular-nums;
}

.fitness-plugin .atomic-felt {
  margin-top: 16px;
}

.fitness-plugin .atomic-felt-bar {
  display: flex;
  gap: 2px;
  height: 8px;
  margin: 8px 0 8px;
}

.fitness-plugin .atomic-felt-bar > span {
  flex: var(--v) 1 0;
  background: var(--atomic-c);
}

.fitness-plugin .atomic-felt-bar > span:first-child {
  border-radius: 2px 0 0 2px;
}

.fitness-plugin .atomic-felt-bar > span:last-child {
  border-radius: 0 2px 2px 0;
}

.fitness-plugin .atomic-felt-bar > .is-ok,
.fitness-plugin .atomic-legend .atomic-dot.is-ok {
  background: color-mix(in oklab, var(--atomic-c) 52%, var(--atomic-paper));
}

.fitness-plugin .atomic-felt-bar > .is-bad,
.fitness-plugin .atomic-legend .atomic-dot.is-bad {
  background: color-mix(in oklab, var(--atomic-c) 26%, var(--atomic-paper));
}

.fitness-plugin .atomic-recent-row {
  display: grid;
  grid-template-columns: 112px minmax(120px, 1fr) auto 16px;
  align-items: center;
  column-gap: 16px;
  min-height: 40px;
  padding: 0 8px;
  margin: 0 -8px;
  border-bottom: 1px solid var(--atomic-rule);
  border-radius: 0;
  cursor: pointer;
  transition: background-color var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-recent-row:hover,
.fitness-plugin .atomic-recent-row.is-preview {
  background: var(--atomic-fill-1);
}

.fitness-plugin .atomic-recent-date {
  color: var(--atomic-ink-2);
  font-variant-numeric: tabular-nums;
}

.fitness-plugin .atomic-recent-sum {
  color: var(--atomic-ink-2);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.fitness-plugin .atomic-recent-sum strong {
  color: var(--atomic-ink);
  font-weight: 500;
}

.fitness-plugin .atomic-recent-arrow {
  color: var(--atomic-ink-2);
  opacity: 0;
  transform: translateX(-4px);
  transition:
    opacity var(--atomic-t-hover) var(--atomic-ease),
    transform var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-recent-row:hover .atomic-recent-arrow,
.fitness-plugin .atomic-recent-row.is-preview .atomic-recent-arrow {
  opacity: 1;
  transform: none;
}

.fitness-plugin .atomic-recent-sub {
  display: none;
}

@container atomic-dash (min-width: 1500px) {
  .fitness-plugin .atomic-split {
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 1.2fr);
  }

  .fitness-plugin .atomic-split > .atomic-section.is-wide {
    grid-column: auto;
  }
}

/*
  Medium panes. The ledger's column minimums add up to ~906px and four KPI
  columns need ~800px, so both stack here. Obsidian's default readable line
  length (~700px) lands in this band, so it is the common case, not an edge.
*/
@container atomic-dash (max-width: 900px) {
  .fitness-plugin .atomic-kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .fitness-plugin .atomic-kpi {
    padding: 14px 0 16px 20px;
  }

  .fitness-plugin .atomic-kpi:nth-child(odd) {
    padding-left: 0;
    padding-right: 12px;
  }

  .fitness-plugin .atomic-kpi + .atomic-kpi {
    border-left: 0;
  }

  .fitness-plugin .atomic-kpi:nth-child(even) {
    border-left: 1px solid var(--atomic-rule);
  }

  .fitness-plugin .atomic-kpi:nth-child(n + 3) {
    border-top: 1px solid var(--atomic-rule);
  }

  .fitness-plugin .atomic-ledger-head {
    display: none;
  }

  .fitness-plugin .atomic-ledger-row {
    grid-template-columns: 1fr 1fr auto;
    grid-template-areas:
      "name name end"
      "count time detail"
      "months months months";
    row-gap: 10px;
    column-gap: 12px;
    padding: 16px 0;
  }

  .fitness-plugin .atomic-ledger-row > .atomic-ledger-name { grid-area: name; }
  .fitness-plugin .atomic-ledger-row > .atomic-ledger-count { grid-area: count; }
  .fitness-plugin .atomic-ledger-row > .atomic-ledger-time { grid-area: time; }
  .fitness-plugin .atomic-ledger-row > .atomic-ledger-detail { grid-area: detail; justify-self: end; text-align: right; }
  .fitness-plugin .atomic-ledger-row > .atomic-ledger-bars { grid-area: months; }
  .fitness-plugin .atomic-ledger-row > .atomic-ledger-end { grid-area: end; }

  .fitness-plugin .atomic-ledger-bars .atomic-month-initials {
    display: grid;
    margin-top: 4px;
  }
}

@container atomic-dash (max-width: 760px) {
  .fitness-plugin .atomic-split {
    grid-template-columns: minmax(0, 1fr);
  }

  .fitness-plugin .atomic-recent-row {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "act sum"
      "date sub";
    row-gap: 2px;
    padding-top: 9px;
    padding-bottom: 9px;
  }

  .fitness-plugin .atomic-recent-row > .atomic-recent-date { grid-area: date; }
  .fitness-plugin .atomic-recent-row > .atomic-name { grid-area: act; }
  .fitness-plugin .atomic-recent-row > .atomic-recent-sum { grid-area: sum; }
  .fitness-plugin .atomic-recent-row > .atomic-recent-arrow { display: none; }
  .fitness-plugin .atomic-recent-row > .atomic-recent-sub {
    display: block;
    grid-area: sub;
    text-align: right;
    color: var(--atomic-ink-2);
  }

  .fitness-plugin .atomic-recent-row .atomic-recent-sum .is-extra {
    display: none;
  }

  .fitness-plugin .atomic-section {
    margin-top: 36px;
  }
}

@container atomic-dash (max-width: 520px) {
  .fitness-plugin .atomic-section-head {
    flex-wrap: wrap;
    row-gap: 4px;
  }

  .fitness-plugin .atomic-section-head > .atomic-readout {
    margin-left: auto;
  }

  .fitness-plugin .atomic-kpi {
    padding: 14px 0 16px 16px;
  }

  .fitness-plugin .atomic-kpi-value {
    font-size: 30px;
  }

  .fitness-plugin .atomic-kpi-value .atomic-unit {
    font-size: 14px;
  }

  .fitness-plugin .atomic-dash-range {
    flex-basis: 0;
    text-align: right;
  }

  .fitness-plugin .atomic-jumps {
    flex-basis: 100%;
    gap: 4px 16px;
  }

  .fitness-plugin .atomic-chart-plot,
  .fitness-plugin .atomic-chart-y {
    height: 132px;
  }

  .fitness-plugin .atomic-chart {
    grid-template-columns: 22px 1fr;
  }

  .fitness-plugin .atomic-chart-x .is-long {
    display: none;
  }

  .fitness-plugin .atomic-chart-x .is-short {
    display: inline;
  }
}

/* --------------------------------------------------------------- heatmap */

.fitness-plugin.atomic-heatmap {
  --atomic-heat-cell: 10px;
  --atomic-heat-gap: 3px;
  margin: 0 0 28px;
}

.fitness-plugin .atomic-heat-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

/*
  Day labels sit beside the scrollport, not over it: the year scrolls next to
  them, so nothing can show through at fractional zoom or DPR.
*/
.fitness-plugin .atomic-heat-body {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  column-gap: 6px;
}

.fitness-plugin .atomic-heat-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 2px;
}

.fitness-plugin .atomic-heat-scroll::-webkit-scrollbar {
  display: none;
}

.fitness-plugin .atomic-heat-grid {
  width: max-content;
}

.fitness-plugin .atomic-heat-months {
  display: grid;
  grid-template-columns: repeat(53, var(--atomic-heat-cell));
  column-gap: var(--atomic-heat-gap);
  height: 16px;
  margin-bottom: 4px;
}

.fitness-plugin .atomic-heat-months > span {
  grid-column: var(--w) / span 4;
}

/* margin-top clears the months row (16px + 4px). */
.fitness-plugin .atomic-heat-days {
  display: grid;
  grid-template-rows: repeat(7, var(--atomic-heat-cell));
  row-gap: var(--atomic-heat-gap);
  margin-top: 20px;
}

.fitness-plugin .atomic-heat-days > span {
  line-height: var(--atomic-heat-cell);
}

.fitness-plugin .atomic-heat-cells {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(7, var(--atomic-heat-cell));
  grid-auto-columns: var(--atomic-heat-cell);
  gap: var(--atomic-heat-gap);
}

.fitness-plugin .atomic-heat-cell {
  width: var(--atomic-heat-cell);
  height: var(--atomic-heat-cell);
  border-radius: 50%;
  background: var(--atomic-empty);
  transition: transform var(--atomic-t-press) var(--atomic-ease);
}

.fitness-plugin .atomic-heat-cell.is-pad {
  visibility: hidden;
}

.fitness-plugin .atomic-heat-cell.is-future {
  background: var(--atomic-future);
}

/* Levels mix toward the page, so "least" is always closest to the paper. */
.fitness-plugin .atomic-heat-cell[data-l="1"] {
  background: color-mix(in oklab, var(--atomic-c) 28%, var(--atomic-paper));
}

.fitness-plugin .atomic-heat-cell[data-l="2"] {
  background: color-mix(in oklab, var(--atomic-c) 52%, var(--atomic-paper));
}

.fitness-plugin .atomic-heat-cell[data-l="3"] {
  background: color-mix(in oklab, var(--atomic-c) 78%, var(--atomic-paper));
}

.fitness-plugin .atomic-heat-cell[data-l="4"] {
  background: var(--atomic-c);
}

.fitness-plugin .atomic-heat-cell.is-today {
  box-shadow:
    0 0 0 1.5px var(--atomic-paper),
    0 0 0 2.75px var(--atomic-ink);
}

.fitness-plugin .atomic-heat-cell:hover,
.fitness-plugin .atomic-heat-cell.is-preview {
  transform: scale(1.35);
}

.fitness-plugin .atomic-heat-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-left: 22px;
  width: max-content;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.fitness-plugin .atomic-heat-legend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.fitness-plugin .atomic-heat-legend .atomic-heat-cell {
  width: 8px;
  height: 8px;
}

.fitness-plugin .atomic-heat-legend .atomic-caption:first-child {
  margin-right: 4px;
}

.fitness-plugin .atomic-heat-legend .atomic-caption:last-child {
  margin-left: 4px;
}

/* -------------------------------------------------------------- actions */

.fitness-plugin.atomic-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 24px;
}

.fitness-plugin.atomic-actions .atomic-btn {
  padding: 0 14px 0 12px;
  gap: 8px;
}

.fitness-plugin.atomic-today {
  margin: 0 0 24px;
}

.fitness-plugin .atomic-today-row {
  grid-template-columns: minmax(0, 1fr) auto 16px;
}

.fitness-plugin .atomic-today-row.is-empty {
  cursor: default;
}

.fitness-plugin .atomic-today-row.is-empty .atomic-recent-sum {
  color: var(--atomic-ink-2);
}

/* ----------------------------------------------------------------- timer */

.fitness-plugin.atomic-timer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "head head"
    "clock actions";
  align-items: end;
  gap: 6px 16px;
  padding: 14px 14px 14px 18px;
  margin: 12px 0 20px;
  max-width: 560px;
}

.fitness-plugin .atomic-timer-head {
  grid-area: head;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.fitness-plugin .atomic-timer-caption {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.fitness-plugin .atomic-timer-head .atomic-readout {
  text-align: right;
}

.fitness-plugin .atomic-timer-head .atomic-label {
  align-items: inherit;
}

.fitness-plugin .atomic-timer-clock {
  grid-area: clock;
  font-size: 34px;
  line-height: 1.15;
  font-weight: 400;
  letter-spacing: -0.02em;
  font-variant-numeric: lining-nums tabular-nums;
  white-space: nowrap;
}

.fitness-plugin .atomic-timer-clock .atomic-unit {
  margin-left: 0.2em;
  font-size: 15px;
  letter-spacing: 0;
}

.fitness-plugin .atomic-timer-actions {
  grid-area: actions;
  display: flex;
  gap: 6px;
  padding-bottom: 2px;
}

.fitness-plugin .atomic-pulse {
  position: relative;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--atomic-c);
}

.fitness-plugin .atomic-pulse::after {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1.5px solid var(--atomic-c);
  opacity: 0;
  animation: atomic-pulse 1.8s var(--atomic-ease) infinite;
}

@keyframes atomic-pulse {
  0% {
    transform: scale(0.5);
    opacity: 0.7;
  }
  70%,
  100% {
    transform: scale(1.4);
    opacity: 0;
  }
}

/* --------------------------------------------------------------- gym log */

.fitness-plugin.atomic-gym-log {
  container-type: inline-size;
  padding: 14px 14px 14px 18px;
  margin: 12px 0 16px;
}

.fitness-plugin .atomic-gym-log-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}

.fitness-plugin .atomic-gym-log-fields {
  display: grid;
  grid-template-columns: minmax(150px, 1.6fr) minmax(104px, 0.9fr) auto minmax(110px, 1.3fr) auto;
  gap: 6px;
  align-items: center;
}

.fitness-plugin.atomic-gym-log .atomic-stepper {
  height: 36px;
}

.fitness-plugin.atomic-gym-log .atomic-btn.is-primary {
  height: 36px;
}

@container (max-width: 560px) {
  .fitness-plugin .atomic-gym-log-fields {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  .fitness-plugin .atomic-gym-log-fields > :first-child,
  .fitness-plugin .atomic-gym-log-fields > :nth-child(4),
  .fitness-plugin .atomic-gym-log-fields > :last-child {
    grid-column: 1 / -1;
  }

  .fitness-plugin.atomic-gym-log .atomic-stepper {
    justify-content: space-between;
  }
}

/* ----------------------------------------------------------- book shelf */

.fitness-plugin.atomic-shelf {
  --atomic-book-w: 96px;
  --atomic-book-h: 150px;
  --atomic-shelf-gap: 12px;
  --atomic-plank-top: color-mix(in srgb, var(--text-normal) 8%, var(--background-primary));
  --atomic-plank-face: color-mix(in srgb, var(--text-normal) 17%, var(--background-primary));
  container-type: inline-size;
  margin: 8px 0 24px;
}

.fitness-plugin .atomic-shelf-scroll {
  overflow-x: auto;
  overflow-y: visible;
  padding: 22px 0 0;
}

.fitness-plugin .atomic-shelf-scroll::-webkit-scrollbar {
  display: none;
}

.fitness-plugin .atomic-shelf-row {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: var(--atomic-shelf-gap);
  width: max-content;
  min-width: 100%;
  box-sizing: border-box;
  padding: 0 14px;
}

/* The plank: the only furniture. Top face, front edge, soft drop. */
.fitness-plugin .atomic-plank {
  position: relative;
  height: 15px;
  border-radius: 1px 1px 3px 3px;
  background:
    linear-gradient(180deg,
      var(--atomic-plank-top) 0,
      var(--atomic-plank-top) 5px,
      color-mix(in srgb, var(--atomic-plank-face), white 10%) 5px,
      var(--atomic-plank-face) 7px,
      color-mix(in srgb, var(--atomic-plank-face), black 6%) 100%);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, var(--background-primary) 55%, transparent),
    0 14px 18px -12px rgba(0, 0, 0, 0.4);
  width: max-content;
  min-width: 100%;
}

.fitness-plugin .atomic-book {
  --px: 0;
  --py: 0;
  --sx: 30%;
  --sy: 18%;
  position: relative;
  flex: none;
  width: var(--atomic-book-w);
  height: var(--atomic-book-h);
  margin-bottom: -4px;
  padding: 0;
  border: 0;
  border-radius: 2px 3px 3px 2px;
  background: var(--atomic-fill-2);
  box-shadow:
    0 1px 0 rgba(0, 0, 0, 0.08),
    0 7px 6px -6px rgba(0, 0, 0, 0.45);
  transform-origin: 50% 100%;
  transform: translateY(0);
  transition:
    transform var(--atomic-t-move) var(--atomic-ease),
    box-shadow var(--atomic-t-move) var(--atomic-ease);
  cursor: pointer;
  z-index: 1;
}

.fitness-plugin .atomic-book-cover {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}

/*
  Painted at rest so a flat cover still reads as a bound book: hinge
  crease near the spine, board edge on the right, a soft top light.
  Flat on purpose: no preserve-3d (WebKit), works on every phone.
*/
.fitness-plugin .atomic-book::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(90deg,
      rgba(0, 0, 0, 0.22) 0,
      rgba(255, 255, 255, 0.14) 2.5%,
      rgba(0, 0, 0, 0) 5%,
      rgba(0, 0, 0, 0.18) 7%,
      rgba(255, 255, 255, 0.16) 8.5%,
      rgba(255, 255, 255, 0) 12%,
      rgba(255, 255, 255, 0) 94%,
      rgba(0, 0, 0, 0.1) 98%,
      rgba(0, 0, 0, 0.26) 100%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 26%, rgba(0, 0, 0, 0) 80%, rgba(0, 0, 0, 0.1));
}

/* Specular sheen that follows the pointer (fine pointers only). */
.fitness-plugin .atomic-book::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(
    circle at var(--sx) var(--sy),
    rgba(255, 255, 255, 0.62) 0,
    rgba(255, 255, 255, 0.18) 28%,
    rgba(255, 255, 255, 0) 58%
  );
  mix-blend-mode: soft-light;
  opacity: 0;
  transition: opacity var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin .atomic-book:focus-visible {
  outline: none;
  box-shadow:
    0 0 0 2px var(--atomic-paper),
    0 0 0 4px var(--atomic-focus);
}

@media (hover: hover) and (pointer: fine) {
  .fitness-plugin .atomic-book:hover {
    z-index: 3;
    transform: perspective(700px) translateY(-8px) rotateX(calc(var(--py) * -12deg)) rotateY(calc(var(--px) * 20deg));
    box-shadow:
      0 1px 0 rgba(0, 0, 0, 0.06),
      0 22px 22px -14px rgba(0, 0, 0, 0.5);
  }

  .fitness-plugin .atomic-book:hover::after {
    opacity: 1;
  }
}

.fitness-plugin .atomic-book.is-preview {
  z-index: 3;
  transform: perspective(700px) translateY(-8px) rotateX(calc(var(--py) * -12deg)) rotateY(calc(var(--px) * 20deg));
  box-shadow:
    0 1px 0 rgba(0, 0, 0, 0.06),
    0 22px 22px -14px rgba(0, 0, 0, 0.5);
}

.fitness-plugin .atomic-book.is-preview::after {
  opacity: 1;
}

/* Touch: first tap lifts and reads out, second tap opens. */
.fitness-plugin .atomic-book.is-lifted {
  z-index: 3;
  transform: translateY(-10px);
  box-shadow:
    0 1px 0 rgba(0, 0, 0, 0.06),
    0 20px 18px -12px rgba(0, 0, 0, 0.45);
}

/* Reading: a ribbon tail hangs out of the book over the plank's edge. */
.fitness-plugin .atomic-book-ribbon {
  position: absolute;
  right: 16%;
  bottom: -20px;
  width: 8px;
  height: 24px;
  z-index: -1;
  filter: drop-shadow(0 1px 0.5px rgba(0, 0, 0, 0.3));
}

.fitness-plugin .atomic-book-ribbon::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--atomic-c);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
}

.fitness-plugin .atomic-shelf-readout {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-height: 20px;
  margin-top: 14px;
  padding: 0 14px;
  white-space: nowrap;
  overflow: hidden;
}

.fitness-plugin .atomic-shelf-readout-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--atomic-ink);
  overflow: hidden;
  text-overflow: ellipsis;
}

.fitness-plugin .atomic-shelf-readout-meta {
  color: var(--atomic-ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
}

.fitness-plugin .atomic-shelf-readout .atomic-readout {
  margin-left: auto;
}

.fitness-plugin .atomic-shelf-readout .atomic-readout:only-child {
  margin-left: 0;
}

@container (max-width: 600px) {
  .fitness-plugin .atomic-shelf-scroll {
    --atomic-book-w: 84px;
    --atomic-book-h: 132px;
    --atomic-shelf-gap: 10px;
    scroll-snap-type: x mandatory;
    /* One gap, so a snapped book's neighbour is fully off the edge, not a sliver. */
    scroll-padding: 0 var(--atomic-shelf-gap);
  }

  .fitness-plugin .atomic-book {
    scroll-snap-align: start;
  }

  .fitness-plugin .atomic-shelf-readout {
    flex-wrap: wrap;
    row-gap: 2px;
  }

  .fitness-plugin .atomic-shelf-readout .atomic-readout {
    margin-left: 0;
    flex-basis: 100%;
  }
}

/* ------------------------------------------------------------- cue cards */

.fitness-plugin:is(.atomic-cues, .atomic-cue-lightbox) {
  --atomic-cue-width: 228px;
  --atomic-cue-step: 186px;
  --atomic-cue-height: 144px;
  --atomic-cue-head: 30px;
  --atomic-cue-line: 22px;
  --atomic-cue-paper: #fffdf8;
  --atomic-cue-ink: #2b2925;
  --atomic-cue-ink-soft: #6f695e;
  --atomic-cue-rule: rgba(72, 98, 142, 0.2);
  --atomic-cue-head-rule: rgba(204, 84, 84, 0.5);
  --atomic-cue-shadow:
    0 0 0 1px rgba(60, 50, 30, 0.06),
    0 1px 1px rgba(40, 30, 10, 0.05),
    0 6px 14px -4px rgba(40, 30, 10, 0.2);
  --atomic-cue-shadow-lift:
    0 0 0 1px rgba(60, 50, 30, 0.06),
    0 3px 6px rgba(40, 30, 10, 0.07),
    0 28px 44px -12px rgba(40, 30, 10, 0.42);
  --atomic-cue-font: "Caveat", "Atomic Cue CJK", "Klee One", "DFKai-SB", "Kaiti TC", "BiauKai", "TW-Kai", "STKaiti", "KaiTi", "AR PL UKai TW", "Noto Serif CJK TC", cursive;
}

/* Dark mode keeps the card a physical, light-but-dimmed sheet. */
.theme-dark .fitness-plugin:is(.atomic-cues, .atomic-cue-lightbox) {
  --atomic-cue-paper: #e6e1d5;
  --atomic-cue-rule: rgba(60, 84, 128, 0.24);
  --atomic-cue-head-rule: rgba(186, 74, 74, 0.55);
  --atomic-cue-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.35),
    0 8px 18px -6px rgba(0, 0, 0, 0.7);
  --atomic-cue-shadow-lift:
    0 0 0 1px rgba(0, 0, 0, 0.35),
    0 26px 40px -12px rgba(0, 0, 0, 0.85);
}

.fitness-plugin.atomic-cues {
  container-type: inline-size;
}

.fitness-plugin .atomic-cues-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}

.fitness-plugin .atomic-cue-fan {
  display: grid;
  grid-template-columns: repeat(auto-fill, var(--atomic-cue-step));
  grid-auto-rows: calc(var(--atomic-cue-height) + 22px);
  padding: 22px calc(var(--atomic-cue-width) - var(--atomic-cue-step)) 8px 0;
}

.fitness-plugin .atomic-cue-card {
  --atomic-cue-tilt: -1.4deg;
  --atomic-cue-drop: 0px;
  position: relative;
  display: block;
  width: var(--atomic-cue-width);
  height: var(--atomic-cue-height);
  padding: 0;
  margin: 0;
  border: 0;
  background: none;
  box-shadow: none;
  text-align: left;
  white-space: normal;
  cursor: pointer;
}

.fitness-plugin .atomic-cue-card:nth-child(4n + 2) {
  --atomic-cue-tilt: 1.1deg;
  --atomic-cue-drop: 7px;
}

.fitness-plugin .atomic-cue-card:nth-child(4n + 3) {
  --atomic-cue-tilt: -0.6deg;
  --atomic-cue-drop: 3px;
}

.fitness-plugin .atomic-cue-card:nth-child(4n + 4) {
  --atomic-cue-tilt: 1.5deg;
  --atomic-cue-drop: 10px;
}

/*
  An authentic 3×5 card: one red header rule, blue lines below. The
  header band stays empty at rest; date and tag read out on hover.
*/
.fitness-plugin .atomic-cue-sheet {
  --atomic-cue-stock: var(--atomic-cue-paper);
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  min-height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  padding: 0 calc(var(--atomic-cue-width) - var(--atomic-cue-step) + 12px) 10px 16px;
  border-radius: 2px;
  background-color: var(--atomic-cue-stock);
  background-image:
    linear-gradient(180deg,
      transparent calc(var(--atomic-cue-head) - 1px),
      var(--atomic-cue-head-rule) calc(var(--atomic-cue-head) - 1px),
      var(--atomic-cue-head-rule) var(--atomic-cue-head),
      transparent var(--atomic-cue-head)),
    linear-gradient(var(--atomic-cue-stock), var(--atomic-cue-stock)),
    repeating-linear-gradient(180deg,
      transparent 0,
      transparent calc(var(--atomic-cue-line) - 1px),
      var(--atomic-cue-rule) calc(var(--atomic-cue-line) - 1px),
      var(--atomic-cue-rule) var(--atomic-cue-line));
  background-position: 0 0, 0 0, 0 var(--atomic-cue-head);
  background-size: auto, 100% var(--atomic-cue-head), auto;
  background-repeat: no-repeat, no-repeat, repeat;
  box-shadow: var(--atomic-cue-shadow);
  transform-origin: 50% 90%;
  transform: rotate(var(--atomic-cue-tilt)) translateY(var(--atomic-cue-drop));
  transition:
    transform var(--atomic-t-move) var(--atomic-ease),
    box-shadow var(--atomic-t-move) var(--atomic-ease),
    padding-right var(--atomic-t-move) var(--atomic-ease);
}

.fitness-plugin .atomic-cue-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  height: var(--atomic-cue-head);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--atomic-cue-ink-soft);
  opacity: 0;
  transform: translateY(3px);
  transition:
    opacity var(--atomic-t-hover) var(--atomic-ease) 80ms,
    transform var(--atomic-t-hover) var(--atomic-ease) 80ms;
}

.fitness-plugin .atomic-cue-body {
  --atomic-cue-wash: 1;
  position: relative;
  min-height: calc(4 * var(--atomic-cue-line));
  max-height: calc(4 * var(--atomic-cue-line));
  overflow: hidden;
}

.fitness-plugin .atomic-cue-body::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 14px;
  pointer-events: none;
  opacity: var(--atomic-cue-wash);
  background: linear-gradient(180deg, transparent, var(--atomic-cue-stock));
}

.fitness-plugin .atomic-cue-text {
  margin: 0;
  padding-top: 1px;
  font-family: var(--atomic-cue-font);
  font-size: 23px;
  line-height: var(--atomic-cue-line);
  color: var(--atomic-cue-ink);
  overflow-wrap: anywhere;
}

/* Repeats get a divider tab in the activity colour; one-offs get none. */
.fitness-plugin .atomic-cue-tab {
  position: absolute;
  top: -8px;
  right: calc(var(--atomic-cue-width) - var(--atomic-cue-step) + 12px);
  height: 16px;
  padding: 0 6px;
  border-radius: 3px 3px 1px 1px;
  background: color-mix(in oklab, var(--atomic-c) 82%, black);
  color: #fff;
  font: 600 11px/16px var(--atomic-font);
  letter-spacing: 0.01em;
  font-variant-numeric: lining-nums tabular-nums;
  box-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
  transition: right var(--atomic-t-move) var(--atomic-ease);
}

.fitness-plugin .atomic-cue-card:hover,
.fitness-plugin .atomic-cue-card:focus-visible,
.fitness-plugin .atomic-cue-card.is-preview {
  z-index: 5;
  outline: none;
}

.fitness-plugin .atomic-cue-card:hover .atomic-cue-sheet,
.fitness-plugin .atomic-cue-card:focus-visible .atomic-cue-sheet,
.fitness-plugin .atomic-cue-card.is-preview .atomic-cue-sheet {
  transform: rotate(0deg) translateY(-18px) scale(1.04);
  padding-right: 14px;
  box-shadow: var(--atomic-cue-shadow-lift);
}

.fitness-plugin .atomic-cue-card:hover .atomic-cue-tab,
.fitness-plugin .atomic-cue-card:focus-visible .atomic-cue-tab,
.fitness-plugin .atomic-cue-card.is-preview .atomic-cue-tab {
  right: 14px;
}

.fitness-plugin .atomic-cue-card:hover .atomic-cue-body,
.fitness-plugin .atomic-cue-card:focus-visible .atomic-cue-body,
.fitness-plugin .atomic-cue-card.is-preview .atomic-cue-body {
  max-height: none;
  --atomic-cue-wash: 0;
}

.fitness-plugin .atomic-cue-card:hover .atomic-cue-meta,
.fitness-plugin .atomic-cue-card:focus-visible .atomic-cue-meta,
.fitness-plugin .atomic-cue-card.is-preview .atomic-cue-meta {
  opacity: 1;
  transform: none;
}

.fitness-plugin .atomic-cue-card.is-flying .atomic-cue-sheet,
.fitness-plugin .atomic-cue-card.is-flying .atomic-cue-tab {
  visibility: hidden;
}

@container (max-width: 600px) {
  .fitness-plugin .atomic-cue-fan {
    grid-template-columns: 1fr;
    grid-auto-rows: auto;
    row-gap: 12px;
    padding: 14px 0 8px;
  }

  .fitness-plugin .atomic-cue-card,
  .fitness-plugin .atomic-cue-card:nth-child(4n + 2),
  .fitness-plugin .atomic-cue-card:nth-child(4n + 3),
  .fitness-plugin .atomic-cue-card:nth-child(4n + 4) {
    --atomic-cue-tilt: -0.5deg;
    --atomic-cue-drop: 0px;
    width: 100%;
    height: auto;
  }

  .fitness-plugin .atomic-cue-card:nth-child(2n) {
    --atomic-cue-tilt: 0.5deg;
  }

  .fitness-plugin .atomic-cue-sheet {
    position: relative;
    padding-right: 14px;
  }

  .fitness-plugin .atomic-cue-body {
    min-height: calc(2 * var(--atomic-cue-line));
    max-height: calc(2 * var(--atomic-cue-line));
    transition: none;
  }

  .fitness-plugin .atomic-cue-tab {
    right: 14px;
  }

  .fitness-plugin .atomic-cue-meta {
    opacity: 1;
    transform: none;
  }

  .fitness-plugin .atomic-cue-card:hover .atomic-cue-sheet,
  .fitness-plugin .atomic-cue-card:focus-visible .atomic-cue-sheet {
    transform: rotate(var(--atomic-cue-tilt));
    box-shadow: var(--atomic-cue-shadow);
  }

  .fitness-plugin .atomic-cue-card:hover .atomic-cue-body,
  .fitness-plugin .atomic-cue-card:focus-visible .atomic-cue-body {
    max-height: calc(2 * var(--atomic-cue-line));
    --atomic-cue-wash: 1;
  }
}

/* Lightbox: fly the same card to centre; blur behind, never dim. */
.fitness-plugin.atomic-cue-lightbox {
  --atomic-cue-fly-scale: 1.65;
  --atomic-cue-fly-inset: 48px;
  --atomic-cue-backdrop-blur: 10px;
  position: fixed;
  inset: 0;
  z-index: 80;
  margin: 0;
  overflow: hidden;
  background: transparent;
}

.fitness-plugin .atomic-cue-lightbox-backdrop {
  position: absolute;
  inset: 0;
  background: transparent;
  -webkit-backdrop-filter: blur(0);
  backdrop-filter: blur(0);
  transition:
    -webkit-backdrop-filter var(--atomic-t-move) var(--atomic-ease),
    backdrop-filter var(--atomic-t-move) var(--atomic-ease);
}

.fitness-plugin.atomic-cue-lightbox.is-placed .atomic-cue-lightbox-backdrop {
  -webkit-backdrop-filter: blur(var(--atomic-cue-backdrop-blur));
  backdrop-filter: blur(var(--atomic-cue-backdrop-blur));
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .fitness-plugin .atomic-cue-lightbox-backdrop,
  .fitness-plugin.atomic-cue-lightbox.is-placed .atomic-cue-lightbox-backdrop {
    background: transparent;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

.fitness-plugin.atomic-cue-lightbox > .atomic-cue-card.atomic-cue-lightbox-card {
  --atomic-cue-tilt: 0deg;
  --atomic-cue-drop: 0px;
  position: fixed;
  left: var(--atomic-cue-origin-left);
  top: var(--atomic-cue-origin-top);
  width: var(--atomic-cue-width);
  max-width: calc((100vw - var(--atomic-cue-fly-inset)) / var(--atomic-cue-fly-scale));
  max-height: calc((100vh - var(--atomic-cue-fly-inset)) / var(--atomic-cue-fly-scale));
  height: auto;
  z-index: 1;
  transform-origin: center center;
  transform: none;
  transition:
    left var(--atomic-t-move) var(--atomic-ease),
    top var(--atomic-t-move) var(--atomic-ease),
    width var(--atomic-t-move) var(--atomic-ease),
    transform var(--atomic-t-move) var(--atomic-ease);
}

.fitness-plugin.atomic-cue-lightbox.is-placed > .atomic-cue-card.atomic-cue-lightbox-card {
  left: 50%;
  top: 50%;
  width: var(--atomic-cue-lightbox-width, var(--atomic-cue-width));
  transform: translate(-50%, -50%) scale(var(--atomic-cue-fly-scale));
}

.fitness-plugin.atomic-cue-lightbox .atomic-cue-lightbox-card .atomic-cue-sheet {
  position: relative;
  transform: rotate(0deg);
  padding-right: 14px;
  box-shadow: var(--atomic-cue-shadow-lift);
}

.fitness-plugin.atomic-cue-lightbox .atomic-cue-lightbox-card .atomic-cue-tab {
  right: 14px;
}

.fitness-plugin.atomic-cue-lightbox .atomic-cue-lightbox-card .atomic-cue-body {
  max-height: none;
  --atomic-cue-wash: 0;
  overflow-x: hidden;
  overflow-y: auto;
}

.fitness-plugin.atomic-cue-lightbox .atomic-cue-lightbox-card .atomic-cue-meta {
  opacity: 1;
  transform: none;
}

/* Off-screen twin that measures the cue's natural line length before fly. */
.fitness-plugin.atomic-cue-lightbox .atomic-cue-sheet.atomic-cue-lightbox-measure {
  position: absolute;
  left: 0;
  top: 0;
  width: max-content;
  max-width: none;
  visibility: hidden;
  pointer-events: none;
  transform: none;
}

.fitness-plugin.atomic-cue-lightbox .atomic-cue-lightbox-measure .atomic-cue-text {
  word-break: keep-all;
  white-space: nowrap;
  overflow-wrap: normal;
}

/* GLASS: one floating read-out under the card. Solid paper fallback. */
.fitness-plugin .atomic-glass {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 32px;
  padding: 0 14px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--background-primary) 58%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.5);
  backdrop-filter: blur(18px) saturate(1.5);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.6),
    inset 0 0 0 1px color-mix(in srgb, var(--text-normal) 9%, transparent),
    0 10px 24px -10px rgba(0, 0, 0, 0.3);
  color: var(--atomic-ink);
}

.theme-dark .fitness-plugin .atomic-glass {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 0 0 1px rgba(255, 255, 255, 0.07),
    0 10px 28px -10px rgba(0, 0, 0, 0.7);
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .fitness-plugin .atomic-glass {
    background: var(--background-primary);
  }
}

.fitness-plugin .atomic-glass .atomic-readout {
  color: var(--atomic-ink);
}

.fitness-plugin .atomic-glass .atomic-readout.is-hint {
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-glass kbd {
  font: inherit;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--atomic-fill-2);
  color: var(--atomic-ink-2);
}

.fitness-plugin .atomic-cue-lightbox-readout {
  position: fixed;
  left: 50%;
  top: var(--atomic-cue-readout-top, 80%);
  z-index: 2;
  transform: translate(-50%, 6px);
  opacity: 0;
  transition:
    opacity var(--atomic-t-hover) var(--atomic-ease),
    transform var(--atomic-t-hover) var(--atomic-ease);
}

.fitness-plugin.atomic-cue-lightbox.is-settled .atomic-cue-lightbox-readout {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* --------------------------------------------------------- reduced motion */

/*
  One switch: the media query. The JS parts (digit roll, cue fly) read the
  same query through activeWindow.matchMedia, so popouts follow their own
  window. Motion tokens drop to 0; transforms that move things are removed.
*/
@media (prefers-reduced-motion: reduce) {
  .fitness-plugin {
    --atomic-t-move: 0ms;
    --atomic-t-hover: 0ms;
    --atomic-t-press: 0ms;
    --atomic-stagger: 0ms;
  }

  .fitness-plugin .atomic-cue-sheet {
    transition: none;
  }

  .fitness-plugin .atomic-cue-card:hover .atomic-cue-sheet,
  .fitness-plugin .atomic-cue-card:focus-visible .atomic-cue-sheet,
  .fitness-plugin .atomic-cue-card.is-preview .atomic-cue-sheet {
    transform: rotate(0deg);
  }

  .fitness-plugin .atomic-book:hover,
  .fitness-plugin .atomic-book.is-preview,
  .fitness-plugin .atomic-book.is-lifted {
    transform: none;
  }

  .fitness-plugin .atomic-book::after {
    display: none;
  }

  .fitness-plugin .atomic-btn:active,
  .fitness-plugin .atomic-heat-cell:hover {
    transform: none;
  }

  .fitness-plugin .atomic-pulse::after {
    animation: none;
    opacity: 0.45;
    transform: none;
  }
}

<script id="js-interact">
/* Mock interactions. Same rules the plugin would follow: read-outs instead
   of tooltips, one motion curve, everything off under reduced motion. */
(function () {
  const D = window.ATOMIC_DATA;
  const U = window.UI;

  // The plugin would read activeWindow.matchMedia; the mock adds a toggle.
  function reduced(el) {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches || !!el.closest(".mock-reduced");
  }

  function moveMs(el) {
    return reduced(el) ? 0 : 560;
  }

  function setReadout(el, content, live) {
    if (!el) return;
    el.replaceChildren(typeof content === "string" ? document.createTextNode(content) : content);
    el.classList.toggle("is-live", !!live);
  }

  /* ------------------------------------------------------- dashboard */
  function wireDashboard(root) {
    let year = 2026;
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      const act = b.getAttribute("data-act");
      if (act !== "prev-year" && act !== "next-year") return;
      const next = act === "prev-year" ? 2025 : 2026;
      if (next === year) return;
      year = next;
      const k = year === 2025 ? D.kpis2025 : D.kpis2026;
      const anim = !reduced(root);
      U.setRoll(root.querySelector(".atomic-stepper-value .atomic-roll"), String(year), anim);
      const kp = root.querySelectorAll(".atomic-kpi");
      const set = (kpiEl, values) => kpiEl.querySelectorAll(".atomic-roll").forEach((r, i) => U.setRoll(r, values[i], anim));
      const [eh, em] = U.hm(k.exerciseMin);
      const [hh, hmn] = U.hm(k.habitMin);
      set(kp[0], [String(k.sessions)]);
      set(kp[1], [String(eh), String(em).padStart(2, "0")]);
      set(kp[2], [U.fmt(k.volume)]);
      set(kp[3], [String(hh), String(hmn).padStart(2, "0")]);
      const range = root.querySelector(".atomic-dash-range");
      if (range && U.LANG !== "zh") range.textContent = year === 2025 ? "Jan 3 – Dec 30 · 171 sessions" : "Jan 2 – Aug 11 · 192 sessions";
    });

    const chart = root.querySelector(".atomic-chart");
    const read = root.querySelector('[data-section="monthly"] .atomic-section-head > .atomic-readout');
    if (chart && read) {
      const def = read.cloneNode(true);
      chart.addEventListener("pointerover", (e) => {
        const col = e.target.closest(".atomic-chart-col");
        if (!col || col.classList.contains("is-future")) return;
        const m = Number(col.getAttribute("data-m"));
        chart.classList.add("is-reading");
        chart.querySelectorAll(".atomic-chart-col").forEach((c, i) => c.classList.toggle("is-hot", i === m));
        chart.querySelectorAll(".atomic-chart-x > span").forEach((c, i) => c.classList.toggle("is-hot", i === m));
        setReadout(read, U.monthlyReadout(m), true);
      });
      chart.addEventListener("pointerleave", () => {
        chart.classList.remove("is-reading");
        chart.querySelectorAll(".is-hot").forEach((c) => c.classList.remove("is-hot"));
        read.replaceChildren(...Array.from(def.cloneNode(true).childNodes));
        read.classList.remove("is-live");
      });
    }
  }

  /* --------------------------------------------------------- heatmap */
  function wireHeatmap(root) {
    const read = root.querySelector(".atomic-heat-head .atomic-readout");
    const def = read.getAttribute("data-default");
    let pinned = null;
    root.addEventListener("pointerover", (e) => {
      const c = e.target.closest(".atomic-heat-cell[data-read]");
      if (c) setReadout(read, c.getAttribute("data-read"), true);
    });
    root.addEventListener("pointerleave", () => {
      if (!pinned) setReadout(read, def, false);
    });
    // Touch: first tap reads, second tap opens the note.
    root.addEventListener("click", (e) => {
      const c = e.target.closest(".atomic-heat-cell[data-read]");
      if (!c) return;
      if (pinned === c) toast(root, `Opens ${c.getAttribute("data-read").split(" · ")[0]} session note`);
      pinned = c;
      setReadout(read, c.getAttribute("data-read"), true);
    });
  }

  // Narrow panes open the year on today, starting on a month boundary so the
  // first label is never cut. Rects are divided by any frame scale.
  function scrollHeatToToday(root) {
    root.querySelectorAll(".atomic-heat-scroll").forEach((sc) => {
      if (sc.scrollWidth <= sc.clientWidth) return;
      const pitch = 13;
      const s = sc.getBoundingClientRect().width / sc.offsetWidth || 1;
      const today = sc.querySelector(".is-today");
      const todayX = (today.getBoundingClientRect().left - sc.getBoundingClientRect().left) / s + sc.scrollLeft;
      const minLeft = todayX + 10 + 2 * pitch - sc.clientWidth;
      const starts = Array.from(sc.querySelectorAll(".atomic-heat-months > span")).map((m) => (Number(m.style.getPropertyValue("--w")) - 1) * pitch);
      sc.scrollLeft = starts.find((x) => x >= minLeft) ?? minLeft;
    });
  }

  /* ----------------------------------------------------------- shelf */
  function wireShelf(root, opts = {}) {
    const read = root.querySelector(".atomic-shelf-readout");
    const def = read.getAttribute("data-default");
    const fine = !opts.touch && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    let lifted = null;
    const reset = () => read.replaceChildren(U.readout(def));
    root.querySelectorAll(".atomic-book").forEach((book) => {
      const b = D.books[Number(book.getAttribute("data-i"))];
      if (fine) {
        book.addEventListener("pointerenter", () => U.fillShelfReadout(read, b, false));
        book.addEventListener("pointermove", (e) => {
          if (reduced(book)) return;
          const r = book.getBoundingClientRect();

          book.style.setProperty("--py", py.toFixed(3));

          book.style.setProperty("--sy", `${((py + 0.5) * 100).toFixed(1)}%`);
        });
        book.addEventListener("pointerleave", () => {
          book.style.setProperty("--px", 0);
          book.style.setProperty("--py", 0);

    const host = frame || document.body;
    const hostRect = frame ? frame.getBoundingClientRect() : { left: 0, top: 0, width: innerWidth, height: innerHeight };
    // The playground may scale a phone frame; fixed children use its unscaled px.
    const hostW = frame ? frame.offsetWidth : innerWidth;
    const hostH = frame ? frame.offsetHeight : innerHeight;
    const scale = hostRect.width / hostW || 1;
    const r = card.getBoundingClientRect();
    const phoneLike = hostW < 600;
    const lb = U.lightbox(cue, { width: phoneLike ? "217px" : "300px", touch: phoneLike });

    lb.style.setProperty("--atomic-cue-origin-top", `${(r.top - hostRect.top) / scale}px`);
    lb.style.setProperty("--atomic-cue-width", `${r.width / scale}px`);

      lb.classList.add("is-placed");

      requestAnimationFrame(() => requestAnimationFrame(place));

      lb.classList.remove("is-settled", "is-placed");
      setTimeout(() => {

        card.classList.remove("is-flying");

      document.removeEventListener("keydown", onKey);
    };

      if (e.key === "Escape") close();

    lbCard.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    return { close };
  }

  function wireTimer(slot, opts = {}) {
    let total = opts.total || 40;
    let started = null;
    let tick = null;
    const render = (state, extra) => {
      const el = U.timer(state, Object.assign({ total }, extra || {}));
      slot.replaceChildren(el);
      return el;
    };
    const fmtClock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    const run = (fromSeconds) => {
      started = Date.now() - fromSeconds * 1000;

        const before = total;

    const p = new URLSearchParams(location.hash.slice(1));

  /* ---------------------------------------------- reduced-motion mirror */
  // The mock can't flip the OS setting, so it copies every rule from the
  // prefers-reduced-motion block under a .mock-reduced ancestor.
  function splitSelectors(text) {
    const out = [];
    let depth = 0;
    let cur = "";
    for (const ch of text) {
      if (ch === "(") depth++;
      if (ch === ")") depth--;
      if (ch === "," && depth === 0) {
        out.push(cur.trim());
        cur = "";
      } else cur += ch;
    }
    out.push(cur.trim());
    return out;
  }

  function mirrorReducedMotion() {
    const rules = [];
    for (const sheet of Array.from(document.styleSheets)) {
      let list;
      try {
        list = sheet.cssRules;
      } catch {
        continue;
      }
      for (const rule of Array.from(list)) {
        if (!(rule instanceof CSSMediaRule) || !/prefers-reduced-motion:\s*reduce/.test(rule.conditionText)) continue;
        for (const inner of Array.from(rule.cssRules)) {
          if (!(inner instanceof CSSStyleRule)) continue;
          const sel = splitSelectors(inner.selectorText).map((s) => `.mock-reduced ${s}`).join(", ");

    if (!rules.length) console.warn("reduced-motion mirror: no rules readable (serve over http or use the inlined file)");

  function avail() {
    return { w: Math.max(320, innerWidth - 48), h: Math.max(420, innerHeight - els.bar.offsetHeight - 44) };

  }

  function phoneFrame(o, maxH, maxW) {
    const p = U.phone({ theme: state.theme, title: o.title, content: o.content });

    p.style.transform = `scale(${s.toFixed(4)})`;
    const fit = h("div", { class: "play-fit", style: { width: `${Math.floor(PHONE_W * s)}px`, height: `${Math.floor(PHONE_H * s)}px` } }, p);
    return { el: fit, host: p.querySelector(".ob-phone-screen") };
