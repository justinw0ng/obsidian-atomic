      return {
        fs,
        wire: () => {
          heats.forEach((x) => I.wireHeatmap(x));
          I.scrollHeatToToday(fs[0].host);
        },
      };
    },

    cues() {
      const root = U.cues({});
      const fs = frames([{ title: "Golf cues", crumbs: ["atomics", "exercise", "Golf", "Golf cues"], content: root }]);
      return { fs, wire: () => I.wireCues(root, fs[0].host) };
    },

    shelf() {
      const s = U.shelf({});
      const heat = U.heatmap("reading", {});
      heat.style.setProperty("margin-top", "28px");
      const fs = frames([{ title: "Book shelf", crumbs: ["atomics", "hobbies", "Reading", "Book shelf"], content: [s, heat] }]);
      return {
        fs,
        wire: () => {
          I.wireShelf(s, { touch: state.view === "phone" });
          I.wireHeatmap(heat);
          I.scrollHeatToToday(fs[0].host);
        },
      };
    },

    timer() {
      const b = D.books.find((x) => x.slug === "the-unhurried-advantage");
      const slot = h("div");
      const props = h(
        "div",
        { class: "ob-props play-note-props" },
        h("div", { class: "ob-props-title" }, "Properties"),
        [["author", b.author], ["status", b.status], ["pages", b.pages]].map(([k, v]) => h("div", { class: "ob-prop" }, h("span", null, k), h("span", null, v))),
      );
      const reading = [props, slot, h("div", { class: "ob-h3" }, "Notes"), h("ul", { class: "ob-ul" }, h("li", null, "Slow is a strategy, not a delay."), h("li", null, "Chapter 4: protect the first hour."))];
      const gl = U.gymLog({});
      const table = h(
        "table",
        { class: "ob-table" },
        h("thead", null, h("tr", null, ["Exercise", "Muscle", "Weight", "Reps", "Notes"].map((x) => h("th", null, x)))),
        h("tbody", null, h("tr", null, ["Squat", "Quads", "80", "5", ""].map((x) => h("td", null, x)))),
      );
      const gym = [h("div", { class: "ob-h2", style: { "margin-top": "0" } }, "Gym — 2026-08-11"), gl, h("div", { class: "play-table-scroll" }, table), h("div", { class: "ob-h2" }, "Reminders"), h("ul", { class: "ob-ul" }, h("li", null, "Pause at the bottom of every squat"))];
      const fs = frames([
        { title: b.title, crumbs: ["atomics", "hobbies", "Reading", b.title], content: reading },
        { title: "2026-08-11", crumbs: ["atomics", "exercise", "Gym", "2026", "2026-08-11"], content: gym },
      ]);
      return {
        fs,
        wire: () => {
          const t = I.wireTimer(slot, { state: "running", fromSeconds: 767, total: 40 });
          cleanups.push(t.stop);
          I.wireGymLog(gl, table);
        },
      };
    },

    system() {
      const board = window.BOARDS["01"]();
      const a = avail();
      const wrap = h("div", { class: "play-sheet", style: { width: `${a.w}px`, height: `${a.h}px` } }, board);
      return {
        fs: [{ el: wrap }],
        wire: () => {
          board.style.zoom = Math.min(1, wrap.clientWidth / board.offsetWidth).toFixed(4);
        },
      };
    },
  };

  /* ------------------------------------------------------------ chrome */
  function toolbar() {
    const tabs = h(
      "div",
      { class: "play-tabs", role: "tablist", "aria-label": "Surface" },
      TABS.map(([id, name]) => h("button", { type: "button", class: "play-tab", role: "tab", "data-tab": id }, name)),
    );
    const toggles = h(
      "div",
      { class: "play-toggles" },
      TOGGLES.map(([key, name, opts]) =>
        h(
          "div",
          { class: "play-toggle" },
          h("span", null, name),
          h("div", { class: "play-seg", role: "group", "aria-label": name }, opts.map(([v, label]) => h("button", { type: "button", "data-key": key, "data-val": v }, label))),
        ),
      ),
    );
    els.hint = h("div", { class: "play-hint" });
    els.bar = h(
      "header",
      { class: "play-bar" },
      h("div", { class: "play-row is-top" }, h("div", { class: "play-title" }, "Atomic Tracker", h("span", null, "Redesign mock · proposal, not shipped")), toggles),
      h("div", { class: "play-row is-tabs" }, tabs, els.hint),
    );
    els.bar.addEventListener("click", (e) => {
      const tab = e.target.closest("[data-tab]");
      const opt = e.target.closest("[data-key]");
      if (tab) set({ tab: tab.getAttribute("data-tab") });
      else if (opt) set({ [opt.getAttribute("data-key")]: opt.getAttribute("data-val") });
    });
    return els.bar;
  }

  function syncToolbar() {
    els.bar.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === state.tab)));
    els.bar.querySelectorAll("[data-key]").forEach((b) => b.setAttribute("aria-pressed", String(state[b.getAttribute("data-key")] === b.getAttribute("data-val"))));
    els.hint.textContent = TABS.find((t) => t[0] === state.tab)[state.view === "phone" ? 3 : 2];
    document.body.classList.toggle("is-dark-page", state.theme === "dark");
    els.stage.classList.toggle("mock-reduced", state.motion === "reduced");
  }

  function render() {
    cleanups.forEach((f) => f());
    cleanups = [];
    syncToolbar();
    U.setLang(state.lang);
    const built = BUILD[state.tab]();
    U.setLang(state.lang);
    els.stage.replaceChildren(...built.fs.map((f) => f.el));
    built.fs.forEach((f) => f.host && pretendNavigation(f.host));
    built.wire();
    writeHash();
  }

  function set(partial) {
    Object.assign(state, partial);
    render();
  }

  function start(root) {
    document.body.classList.add("is-play");
    document.documentElement.lang = "en";
    readHash();
    els.stage = h("main", { class: "play-stage" });
    root.append(toolbar(), els.stage);
    mirrorReducedMotion();
    let t = null;
    addEventListener("resize", () => {
      clearTimeout(t);
      t = setTimeout(render, 150);
    });
    addEventListener("hashchange", () => {
      readHash();
      render();
    });
    document.fonts.ready.then(() => {
      render();
      window.__ready = true;
    });
  }

  window.PLAY = { start, set, get state() { return Object.assign({}, state); } };
})();

</script>
<script id="js-main">
(async function () {
  const params = new URLSearchParams(location.search);
  const id = params.get("board");
  const root = document.getElementById("root");
  if (!id) {
    window.PLAY.start(root);
    return;
  }
  document.body.classList.add("is-board");
  const el = window.BOARDS[id]();
  root.append(el);
  await document.fonts.ready;
  await Promise.all(Array.from(document.images).map((im) => (im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)))));
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  if (el._after) el._after(el);
  await new Promise((r) => requestAnimationFrame(r));
  if (params.get("markers") !== "0") window.placeMarkers(el);
  window.__ready = true;
})();

</script>
</body>
